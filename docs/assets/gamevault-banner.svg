<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#161029"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- controller icon -->
  <g transform="translate(90,90)">
    <rect x="0" y="18" width="110" height="64" rx="30" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <line x1="30" y1="46" x2="30" y2="62" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="54" x2="38" y2="54" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="42" r="5" fill="#e5e7eb"/>
    <circle cx="94" cy="56" r="5" fill="#e5e7eb"/>
  </g>

  <text x="240" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">GameVault</text>
  <text x="242" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#a1a1aa">Game Database Browser · powered by RAWG</text>

  <!-- decorative genre-style pills -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#c4b5fd">
    <rect x="242" y="200" width="76" height="30" rx="15" fill="#7c3aed33"/>
    <text x="258" y="220">Action</text>

    <rect x="328" y="200" width="60" height="30" rx="15" fill="#7c3aed33"/>
    <text x="344" y="220">RPG</text>

    <rect x="398" y="200" width="88" height="30" rx="15" fill="#7c3aed33"/>
    <text x="414" y="220">Adventure</text>
  </g>
</svg>
